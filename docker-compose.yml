services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medjon
      POSTGRES_USER: medjon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
