services:
  web:
    build: ./frontend
    environment:
      MEDJON_API_KEY: ${MEDJON_API_KEY:?configure MEDJON_API_KEY}
      MEDJON_BACKEND_URL: http://api:8000
      MEDJON_WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://medjon:${POSTGRES_PASSWORD}@db:5432/medjon
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medjon
      POSTGRES_USER: medjon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medjon -d medjon"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  ollama_data:
